<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meowny">
<meta name="theme-color" content="#FFF2BA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Meowny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan: buttermilk ground, midnight-blue ink and one midnight "wants left" tile where the cat lives (inverted in dark mode).
   Fraunces for headings and big figures, Figtree for text, DM Mono for every amount in a list. */
:root{
  --bg:#FFF2BA; --surface:#FFF9DF; --ink:#0F3C65; --muted:#526A82; --line:#EADB97;
  --accent:#0F3C65; --accent-ink:#FFF2BA; --accent-soft:#F4E49C; --blush:#F3AFBE;
  --good:#24774A; --warn:#9A6400; --bad:#B3304A; --want:#A0457A; --need:#2C6C9E; --fixed:#66778A;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B2B49; --surface:#0F3C65; --ink:#FFF2BA; --muted:#C8C39D; --line:#24547F;
    --accent:#FFF2BA; --accent-ink:#0F3C65; --accent-soft:#1E5283; --blush:#E39AAC;
    --good:#86D6A8; --warn:#F3C861; --bad:#FF8C9C; --want:#F2A9CB; --need:#A3CCF0; --fixed:#B9C4CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B2B49; --surface:#0F3C65; --ink:#FFF2BA; --muted:#C8C39D; --line:#24547F;
    --accent:#FFF2BA; --accent-ink:#0F3C65; --accent-soft:#1E5283; --blush:#E39AAC;
    --good:#86D6A8; --warn:#F3C861; --bad:#FF8C9C; --want:#F2A9CB; --need:#A3CCF0; --fixed:#B9C4CC;
  color-scheme:dark;
}

:root.force-dark{
  --bg:#0B2B49; --surface:#0F3C65; --ink:#FFF2BA; --muted:#C8C39D; --line:#24547F;
    --accent:#FFF2BA; --accent-ink:#0F3C65; --accent-soft:#1E5283; --blush:#E39AAC;
    --good:#86D6A8; --warn:#F3C861; --bad:#FF8C9C; --want:#F2A9CB; --need:#A3CCF0; --fixed:#B9C4CC;
  color-scheme:dark;
}
:root.force-light{
  --bg:#FFF2BA; --surface:#FFF9DF; --ink:#0F3C65; --muted:#526A82; --line:#EADB97;
  --accent:#0F3C65; --accent-ink:#FFF2BA; --accent-soft:#F4E49C; --blush:#F3AFBE;
  --good:#24774A; --warn:#9A6400; --bad:#B3304A; --want:#A0457A; --need:#2C6C9E; --fixed:#66778A;
    color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:20px;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.brand span{font-style:italic;font-weight:700}
.themebtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.themebtn svg{width:20px;height:20px}
.cycle{font-size:13px;color:var(--muted);text-align:right}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}

/* hero */
.hero{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:22px 18px 18px;margin-top:46px}
.hero.withphoto{margin-top:66px}
.hero .cat.photo{width:100px;height:100px;top:-72px;right:16px}
.cat.photo{border-radius:50%;object-fit:cover;border:4px solid var(--accent);background:var(--surface);display:block}
.welcome .cat.photo{width:120px;height:120px}
.mascot-prev{width:72px;height:72px;flex:none}
.hero .cat{position:absolute;right:14px;top:-62px;width:118px;height:84px}
.hero .label{color:inherit;opacity:.85}
.hero .amount{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero .per{font-weight:600}
.bubble{position:absolute;right:128px;top:-50px;max-width:200px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:7px 10px;font-size:12.5px;font-weight:600;line-height:1.3}
.track{height:10px;border-radius:99px;background:color-mix(in srgb, currentColor 18%, transparent);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:currentColor}
.hero .track{margin-top:14px}
.hero .meta{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;opacity:.9}

/* bars */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--need)}
.bar.over i{background:var(--bad)}
.bar.good i{background:var(--good)}
.budget{display:grid;gap:6px}
.budget + .budget{margin-top:12px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:12.5px;color:var(--muted)}
.mono{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.g-want{background:color-mix(in srgb,var(--want) 16%,transparent);color:var(--want)}
.g-need{background:color-mix(in srgb,var(--need) 16%,transparent);color:var(--need)}
.g-fixed{background:color-mix(in srgb,var(--fixed) 18%,transparent);color:var(--fixed)}
.g-income{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.g-debt{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.dayhead{display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--muted);padding:12px 0 2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.paid{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.due{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11.5px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal button{border:0;background:none;border-radius:12px;padding:6px 0 8px;min-height:46px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cal button.today{background:var(--accent-soft)}
.cal button.sel{outline:2px solid var(--accent)}
.cal button.out{opacity:.35}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.d-bill{background:var(--need)} .d-sub{background:var(--want)} .d-debt{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* nav + fab */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px 14px;pointer-events:none}
.navbar{pointer-events:auto;width:100%;max-width:456px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 8px 28px rgba(15,60,101,.14)}
.navbar button{border:0;background:none;border-radius:16px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.navbar button svg{width:22px;height:22px}
.navbar button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.fab{position:fixed;right:max(16px, calc(50% - 224px));bottom:92px;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;z-index:5}
.fab svg{width:34px;height:34px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,16,.45);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px 28px;transform:translateY(105%);transition:transform .22s ease;z-index:11}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.amount-in{font-family:var(--display) !important;font-size:34px !important;font-weight:800;padding:6px 12px !important}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 2px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chiphead{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);width:100%;margin-top:4px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.actions{display:flex;gap:10px}
.actions .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
.toast.show{opacity:1}
.welcome{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.welcome .cat{width:150px;height:108px}
.bubble{font:inherit;font-size:12.5px;font-weight:600;text-align:left;cursor:pointer}
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.35)}
html{background:var(--bg)}
body.hasbg{background:transparent}
.mono img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.mono.emo{font-size:20px;background:var(--accent-soft);color:var(--ink)}
.splash{position:fixed;inset:0;z-index:30;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .35s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash .logo{font-family:var(--display);font-weight:800;font-size:60px;letter-spacing:-.03em;line-height:1}
.splash .logo span{font-style:italic;font-weight:700}
.splash .cat{position:static;width:190px;height:136px}
.splash .cat.photo{width:160px;height:160px;border-color:var(--accent-ink)}
.splash .go{background:var(--accent-ink);color:var(--accent);border:0;border-radius:99px;padding:15px 34px;font-weight:800;font-size:17px}
.splash .tag{opacity:.85;font-weight:600;max-width:260px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--body);fill:var(--muted)}
.ms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:flex-start;background:var(--surface)}
.badge .em{font-size:22px;line-height:1;filter:grayscale(1);opacity:.4;flex:none}
.badge.done{border-color:var(--accent);background:var(--accent-soft)}
.badge.done .em{filter:none;opacity:1}
.badge b{display:block;font-size:13px;line-height:1.25}
.badge span{font-size:11.5px;color:var(--muted)}
.emogrid{display:flex;flex-wrap:wrap;gap:6px}
.emogrid button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;padding:0;display:grid;place-items:center;overflow:hidden}
.emogrid button img{width:100%;height:100%;object-fit:cover}
.emogrid button.on{border-color:var(--accent);background:var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
.legend2{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
:root.theme-sunset{--bg:#46334F;--surface:#56415F;--ink:#FFF1D6;--muted:#CDCBE3;--line:#6B5678;--accent:#F2C230;--accent-ink:#46334F;--accent-soft:#6C5148;--blush:#F2921D;--good:#9FE3A5;--warn:#F2C230;--bad:#FF7148;--want:#F2921D;--need:#B4B6DC;--fixed:#BBAAC6;color-scheme:dark}
:root.theme-sunset .fab{background:#F2921D;color:#46334F}
:root.theme-sunset .hero .track i{background:#F24F13}
@supports (padding:env(safe-area-inset-top)){.app{padding-top:max(16px,env(safe-area-inset-top))}nav{padding-bottom:max(14px,env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion: reduce){.splash{transition:none}.sheet{transition:none}.toast{transition:none}}
</style>
</head>
<body>
<div id="bgimg"></div>
<div class="splash" id="splash" role="dialog" aria-label="Welcome"></div>
<div class="app" id="app"></div>

<button class="fab" id="fab" aria-label="Add an entry">
  <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor"><ellipse cx="20" cy="26" rx="8.5" ry="7"/><ellipse cx="9.5" cy="16.5" rx="3.6" ry="4.4"/><ellipse cx="16" cy="10.5" rx="3.6" ry="4.6"/><ellipse cx="24" cy="10.5" rx="3.6" ry="4.6"/><ellipse cx="30.5" cy="16.5" rx="3.6" ry="4.4"/></g></svg>
</button>

<nav><div class="navbar" id="navbar">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="entries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Entries</button>
  <button data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Bills</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h11v4"/><rect x="4" y="7" width="16" height="12" rx="2.5"/><path d="M16 13h.01"/></svg>Money</button>
  <button data-tab="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Grow</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const fmt = n => "RM " + r2(Math.abs(n)).toLocaleString("en-MY", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtS = n => (n < 0 ? "-" : "") + fmt(n);
const fmt0 = n => "RM " + Math.round(Math.abs(n)).toLocaleString("en-MY");
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const ymOf = s => s.slice(0, 7);
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const uid8 = () => Math.random().toString(36).slice(2, 10);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const niceD = s => { const d = parseD(s); return DOW[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()]; };
const niceYM = ym => { const [y, m] = ym.split("-").map(Number); return MONTHS[m - 1] + " " + y; };
const addM = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const initials = s => (String(s).trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2) || "?").toUpperCase();
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }

function starter(){
  const C = (id, name, group, budget) => ({id, name, group, budget: budget ?? null});
  return {
    v:1, payday:25, wantsCap:600, created:iso(new Date()),

let S = null;            // settings

let IMG = {};            // image key -> data URL

const pending = {}, writing = {};

function allTx(){ return Object.values(TX).flat(); }
function localSave(){ try{ localStorage.setItem(LKEY, JSON.stringify({S, TX, IMG})); }catch(e){ toast("Phone storage is full. Remove the background photo or some icons."); } }
function localLoad(){ try{ const j = JSON.parse(localStorage.getItem(LKEY) || "null"); if(j && j.S){ S = j.S; TX = j.TX || {}; IMG = j.IMG || {}; migrate(S); } }catch(e){} }

function queueWrite(id, body){
  pending[id] = JSON.parse(JSON.stringify(body));
  if(!writing[id]) flush(id);
}
async function flush(id){
  writing[id] = true;
  while(pending[id]){
    const b = pending[id]; pending[id] = null;
    if(mode !== "cloud"){ localSave(); continue; }
    try{ await col.doc(id).set(b); }
    catch(e){
      if(e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*800)); try{ await col.doc(id).set(b); continue; }catch(e2){ e = e2; } }
      if(e && e.code === "quota_exceeded") toast("Storage is full. Back up and clear old months in Settings.");
      else toast("Couldn't save. Check your connection and try again.");
    }
  }
  writing[id] = false;
}
let settingsTimer = null;
function saveSettings(){ clearTimeout(settingsTimer); settingsTimer = setTimeout(() => queueWrite("settings", S), 400); }
function saveMonth(ym){ queueWrite("tx-" + ym, {items: TX[ym] || []}); }

/* ---------- money logic ---------- */
function cycle(today){
  const t = today || new Date(); t.setHours(0,0,0,0);
  const P = Math.min(Math.max(+S.payday || 25, 1), 31);
  const pd = (y, m) => new Date(y, m, Math.min(P, dim(y, m)));
  let start = pd(t.getFullYear(), t.getMonth());
  if(t < start){ start = pd(t.getFullYear(), t.getMonth() - 1); }
  const end = pd(start.getFullYear(), start.getMonth() + 1);
  const daysLeft = Math.max(1, Math.round((end - t) / 864e5));
  const len = Math.round((end - start) / 864e5);
  return {start, end, daysLeft, len, s: iso(start), e: iso(end)};
}
function catOf(id){ return S.cats.find(c => c.id === id) || {id, name:"Uncategorised", group:"want"}; }
function refName(ref){
  if(!ref) return "Not set";
  const [k, id] = ref.split(":");
  const o = k === "acc" ? S.accounts.find(a => a.id === id) : k === "pf" ? (S.portfolios || []).find(p => p.id === id) : S.debts.find(d => d.id === id);
  return o ? o.name : "Removed";
}
function accEffect(id, list){
  const r = "acc:" + id; let n = 0;
  for(const t of list){
    if(t.to === r && (t.type === "in" || t.type === "move")) n += t.amount;
    if(t.from === r && (t.type === "out" || t.type === "pay" || t.type === "move" || t.type === "save")) n -= t.amount;
  }
  return n;
}
function debtEffect(id, list){
  const r = "debt:" + id; let n = 0;
  for(const t of list){
    if(t.from === r && t.type === "out") n += t.amount;
    if(t.to === r && t.type === "pay") n -= t.amount;
  }
  return n;
}
function accBal(a){ return r2((+a.opening || 0) + accEffect(a.id, allTx())); }
function debtLeft(d){ return r2((+d.opening || 0) + debtEffect(d.id, allTx())); }
function inCycle(c){ return allTx().filter(t => t.date >= c.s && t.date < c.e); }
function billAmount(b, ym){ return r2(b.sched && b.sched[ym] != null ? b.sched[ym] : b.amount); }
function billActive(b, ym){ return (!b.starts || ym >= b.starts) && (!b.ends || ym <= b.ends); }
function billPaid(b, ym){ return allTx().some(t => t.billId === b.id && t.billMonth === ym); }
function billDate(b, ym){ if(!b.day) return null; const [y, m] = ym.split("-").map(Number); return ym + "-" + pad(Math.min(b.day, dim(y, m - 1))); }

function themePref(){ if(S && S.theme) return S.theme; try{ return localStorage.getItem("kk-theme") || "auto"; }catch(e){ return "auto"; } }
function isDark(){ const p = themePref(); if(p !== "auto") return p !== "light"; const h = document.documentElement.dataset.theme; if(h) return h === "dark"; return matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(){ const p = themePref(), r = document.documentElement; r.classList.toggle("force-dark", p === "dark"); r.classList.toggle("force-light", p === "light"); r.classList.toggle("theme-sunset", p === "sunset"); }

function shrinkPhoto(file, n, square, q){
  n = n || 280; if(square === undefined) square = true;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"), W = img.naturalWidth, H = img.naturalHeight;
      if(square){ c.width = c.height = n; const side = Math.min(W, H); c.getContext("2d").drawImage(img, (W - side) / 2, (H - side) / 2, side, side, 0, 0, n, n); }
      else { const k = Math.min(1, n / Math.max(W, H)); c.width = Math.round(W * k); c.height = Math.round(H * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); }
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q || 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function homeHTML(){
  const c = cycle(), list = inCycle(c);
  const outs = list.filter(t => t.type === "out");
  const wants = r2(outs.filter(t => catOf(t.cat).group === "want").reduce((a, t) => a + t.amount, 0));
  const spent = r2(outs.reduce((a, t) => a + t.amount, 0));
  const paidDebt = r2(list.filter(t => t.type === "pay").reduce((a, t) => a + t.amount, 0));
  const left = r2(S.wantsCap - wants);
  const perDay = left / c.daysLeft;
  const usedPct = Math.min(100, S.wantsCap ? wants / S.wantsCap * 100 : 0);
  const timePct = (c.len - c.daysLeft) / c.len * 100;
  const mood = left < 0 ? "worried" : (usedPct <= timePct + 5 ? "happy" : "okay");
  const say = left < 0 ? `Over by ${fmt0(-left)}. Let's pause the treats till payday.`
    : mood === "happy" ? (wants === 0 ? "Fresh pay month. Log your first spend with the paw." : "On track. Treats are allowed.")
    : `A bit ahead of pace. Try to keep under ${fmt0(Math.max(0, perDay))} a day.`;
  const totalDebt = r2(S.debts.reduce((a, d) => a + Math.max(0, debtLeft(d)), 0));
  const startDebt = r2(S.debts.reduce((a, d) => a + (+d.opening || 0), 0));
  const assets = r2(S.accounts.reduce((a, x) => a + accBal(x), 0));
  const unsetAcc = S.accounts.filter(a => a.opening == null).length;
  const ym = ymOf(iso(new Date()));
  const today = iso(new Date());
  const soon = [];
  for(const m of [ym, addM(ym, 1)]){
    for(const b of S.bills){
      if(!billActive(b, m) || billPaid(b, m)) continue;
      const d = billDate(b, m); if(!d) continue;
      const diff = Math.round((parseD(d) - parseD(today)) / 864e5);
      if((m === ym && diff < 0) || (diff >= 0 && diff <= 10)) soon.push({b, m, d, diff});
    }
  }
  soon.sort((a, b) => a.d.localeCompare(b.d));
  const noDate = S.bills.filter(b => !b.day && billActive(b, ym) && !billPaid(b, ym)).length;
  const needs = S.cats.filter(x => x.group === "need" && x.budget);
  const latest = allTx().slice().sort((a, b) => (b.date + b.ts).localeCompare(a.date + a.ts)).slice(0, 5);

  return `
  <section class="hero ${S.photo ? "withphoto" : ""}" aria-label="Wants left this pay month">
    <button class="bubble" id="bubble" aria-label="Edit captions">${esc(caption(say))}</button>
    ${catArt(mood)}
    <div class="label">Wants left this pay month</div>
    <div class="amount">${fmtS(left)}</div>
    <div class="per">${left > 0 ? fmt(perDay) + " a day for " + c.daysLeft + " days" : "Nothing left for wants until payday"}</div>
    <div class="track"><i style="width:${usedPct}%"></i></div>
    <div class="meta"><span>${fmt0(wants)} of ${fmt0(S.wantsCap)} spent</span><span>${Math.round(timePct)}% of the month gone</span></div>
  </section>
  <div class="grid2">
    <div class="card"><div class="label">Spent this pay month</div><div class="big">${fmt0(spent)}</div><div class="small muted">needs, bills and wants</div></div>
    <div class="card"><div class="label">Paid to debts</div><div class="big">${fmt0(paidDebt)}</div><div class="small muted">since ${new Date(c.start).getDate()} ${MONTHS[new Date(c.start).getMonth()]}</div></div>
  </div>
  <div class="card">
    <div class="row between"><div class="label">Debt left</div><button class="link small" data-go="money">See all</button></div>
    <div class="big">${fmt(totalDebt)}</div>
    <div class="bar good" style="margin:8px 0 4px"><i style="width:${startDebt ? Math.max(0, Math.min(100, (startDebt - totalDebt) / startDebt * 100)) : 0}%"></i></div>
    <div class="small muted">${fmt0(Math.max(0, startDebt - totalDebt))} paid off since you started tracking.${S.debts.some(d => d.id === "cimb") ? ` CIMB card: <b class="num">${fmt(debtLeft(S.debts.find(d => d.id === "cimb")))}</b>` : ""}</div>
  </div>
  <div class="card">
    <div class="row between"><h2>Coming up</h2><button class="link small" data-go="bills">All bills</button></div>
    <div class="list">${soon.length ? soon.map(x => billRow(x.b, x.m, x.diff)).join("") : `<div class="empty">Nothing due in the next 10 days.</div>`}</div>
    ${noDate ? `<div class="small muted" style="margin-top:6px">${noDate} bill${noDate > 1 ? "s have" : " has"} no date yet. <button class="link" data-go="bills">Add dates</button></div>` : ""}
  </div>
  ${needs.length ? `<div class="card"><h2 style="margin-bottom:10px">Needs budget</h2>${needs.map(n => {
      const s = r2(outs.filter(t => t.cat === n.id).reduce((a, t) => a + t.amount, 0));
      const p = Math.min(100, s / n.budget * 100);
      return `<div class="budget"><div class="row between small"><b>${esc(n.name)}</b><span class="num">${fmt0(s)} / ${fmt0(n.budget)}</span></div><div class="bar ${s > n.budget ? "over" : ""}"><i style="width:${p}%"></i></div></div>`;
    }).join("")}</div>` : ""}
  <div class="card">
    <div class="row between"><div class="label">Saved so far</div><button class="link small" data-go="grow">Grow</button></div>
    <div class="big">${fmt(totalSaved())}</div>
    ${(() => { const m = milestones().find(x => !x.done); return m ? `<div class="small muted" style="margin-top:4px">Next milestone: <b>${m.em} ${esc(m.title)}</b>${m.prog != null ? ` · ${Math.round(Math.min(1, m.prog) * 100)}%` : ""}</div>` : `<div class="small muted">Every milestone unlocked.</div>`; })()}
  </div>
  <div class="card">
    <div class="row between"><h2>Latest entries</h2><button class="link small" data-go="entries">All entries</button></div>
    <div class="list">${latest.length ? latest.map(txRow).join("") : `<div class="empty">No entries yet. Tap the paw to log one.</div>`}</div>

    <div class="big ${assets - totalDebt < 0 ? "neg" : ""}">${fmtS(assets - totalDebt)}</div>

function billRow(b, ym, diff){
  const amt = billAmount(b, ym), paid = billPaid(b, ym), d = billDate(b, ym);
  const g = b.kind === "debt" ? "g-debt" : b.kind === "sub" ? "g-want" : "g-need";
  let pill = "";
  if(paid) pill = `<span class="pill paid">Paid</span>`;
  else if(d && diff == null){ const dd = Math.round((parseD(d) - parseD(iso(new Date()))) / 864e5); diff = dd; }
  if(!paid && d){ pill = diff < 0 ? `<span class="pill late">${-diff}d late</span>` : diff === 0 ? `<span class="pill due">Today</span>` : `<span class="pill due">${niceD(d)}</span>`; }
  if(!paid && !d) pill = `<span class="pill">No date</span>`;
  return `<div class="item">${ic(b, b.name, g)}
    <button class="grow link" style="color:inherit;text-align:left;font-weight:400" data-bill="${b.id}"><div class="title">${esc(b.name)}</div><div class="sub">${pill}</div></button>
    <div style="text-align:right"><div class="num">${fmt(amt)}</div>${paid ? "" : `<button class="btn small" data-pay="${b.id}" data-ym="${ym}" style="margin-top:4px">Mark paid</button>`}</div></div>`;
}
function txRow(t){
  const c = t.type === "out" || t.type === "in" ? catOf(t.cat) : null;
  let title, sub, g, sign;
  if(t.type === "out"){ title = t.note || c.name; sub = refName(t.from) + " · " + c.name; g = "g-" + c.group; sign = -1; }
  else if(t.type === "in"){ title = t.note || c.name; sub = refName(t.to) + " · " + c.name; g = "g-income"; sign = 1; }
  else if(t.type === "pay"){ title = t.note || ("Paid " + refName(t.to)); sub = refName(t.from) + " to " + refName(t.to); g = "g-debt"; sign = -1; }
  else if(t.type === "save"){ title = t.note || ("Saved to " + refName(t.to)); sub = (t.from ? refName(t.from) : "New money") + " to " + refName(t.to); g = "g-income"; sign = 2; }
  else { title = t.note || "Moved money"; sub = refName(t.from) + " to " + refName(t.to); g = "g-fixed"; sign = 0; }
  const label = c ? c.name : t.type === "pay" || t.type === "save" ? refName(t.to) : "Move";
  const src = c || (t.type === "pay" ? S.debts.find(d => "debt:" + d.id === t.to) : t.type === "save" ? (S.portfolios || []).find(p => "pf:" + p.id === t.to) : null);
  return `<button class="item" data-tx="${t.id}">${ic(src, label, g)}<div class="grow"><div class="title">${esc(title)}</div><div class="sub">${esc(sub)}</div></div><div class="num ${sign < 0 ? "neg" : sign > 0 ? "pos" : ""}">${sign < 0 ? "-" : sign === 1 ? "+" : sign === 2 ? "→ " : ""}${fmt(t.amount).replace("RM ", "")}</div></button>`;
}

function entriesHTML(){
  const ym = entMonth || ymOf(iso(new Date()));
  const list = (TX[ym] || []).slice().sort((a, b) => (b.date + b.ts).localeCompare(a.date + a.ts));
  const out = r2(list.filter(t => t.type === "out" || t.type === "pay").reduce((a, t) => a + t.amount, 0));
  const inn = r2(list.filter(t => t.type === "in").reduce((a, t) => a + t.amount, 0));
  const days = {};
  list.forEach(t => (days[t.date] = days[t.date] || []).push(t));
  return `<div class="card"><div class="row between"><button class="btn ghost small" data-em="-1" aria-label="Previous month">‹</button><h2>${niceYM(ym)}</h2><button class="btn ghost small" data-em="1" aria-label="Next month">›</button></div>
    <div class="small muted" style="text-align:center;margin-top:6px">${list.length} entries · <span class="num neg">${fmt(out)}</span> out · <span class="num pos">${fmt(inn)}</span> in</div></div>
    <div class="card">${list.length ? Object.keys(days).map(d => {
      const net = r2(days[d].reduce((a, t) => a + (t.type === "in" ? t.amount : t.type === "move" || t.type === "save" ? 0 : -t.amount), 0));
      return `<div class="dayhead"><span>${niceD(d)}</span><span class="num">${fmtS(net)}</span></div><div class="list">${days[d].map(txRow).join("")}</div>`;
    }).join("") : `<div class="empty">No entries in ${niceYM(ym)}.</div>`}</div>`;
}

function billsHTML(){
  const ym = calMonth || ymOf(iso(new Date()));
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1), offset = (first.getDay() + 6) % 7, n = dim(y, m - 1);
  const today = iso(new Date());
  const active = S.bills.filter(b => billActive(b, ym));
  let cells = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("");
  for(let i = 0; i < offset; i++) cells += "<div></div>";
  for(let d = 1; d <= n; d++){
    const ds = ym + "-" + pad(d);
    const kinds = active.filter(b => billDate(b, ym) === ds).map(b => b.kind);
    cells += `<button data-day="${ds}" class="${ds === today ? "today" : ""} ${calSel === ds ? "sel" : ""}" aria-label="${niceD(ds)}${kinds.length ? ", " + kinds.length + " due" : ""}"><span>${d}</span><span class="dots">${[...new Set(kinds)].map(k => `<i class="d-${k}"></i>`).join("")}</span></button>`;
  }
  const sel = calSel && ymOf(calSel) === ym ? active.filter(b => billDate(b, ym) === calSel) : null;
  const group = (k, title) => {
    const bs = active.filter(b => b.kind === k).sort((a, b) => (a.day || 99) - (b.day || 99));
    const tot = r2(bs.reduce((a, b) => a + billAmount(b, ym), 0));
    return `<div class="card"><div class="row between"><h2>${title}</h2><span class="num muted">${fmt(tot)}/mo</span></div><div class="list">${bs.length ? bs.map(b => billRow(b, ym)).join("") : `<div class="empty">None this month.</div>`}</div></div>`;
  };
  const total = r2(active.reduce((a, b) => a + billAmount(b, ym), 0));
  const paid = r2(active.filter(b => billPaid(b, ym)).reduce((a, b) => a + billAmount(b, ym), 0));
  return `<div class="card">
      <div class="row between"><button class="btn ghost small" data-cm="-1" aria-label="Previous month">‹</button><h2>${niceYM(ym)}</h2><button class="btn ghost small" data-cm="1" aria-label="Next month">›</button></div>
      <div class="small muted" style="text-align:center;margin:6px 0 10px"><span class="num">${fmt(paid)}</span> of <span class="num">${fmt(total)}</span> paid</div>
      <div class="cal">${cells}</div>
      <div class="legend" style="margin-top:10px"><span><i class="d-bill"></i>Bill</span><span><i class="d-sub"></i>Subscription</span><span><i class="d-debt"></i>Debt repayment</span></div>
    </div>
    ${sel ? `<div class="card"><h2>${niceD(calSel)}</h2><div class="list">${sel.length ? sel.map(b => billRow(b, ym)).join("") : `<div class="empty">Nothing due.</div>`}</div></div>` : ""}
    ${group("bill", "Bills")}${group("sub", "Subscriptions")}${group("debt", "Debt repayments")}
    <button class="btn" data-newbill>Add a bill or subscription</button>`;
}

/* ---------- wiring ---------- */
function wire(){
  const tb = $("#themebtn"); if(tb) tb.onclick = () => { const order = ["light","dark","sunset"], cur = themePref() === "auto" ? (isDark() ? "dark" : "light") : themePref(); setTheme(order[(order.indexOf(cur) + 1) % order.length]); };
  const gb = $("#gearbtn"); if(gb) gb.onclick = () => { tab = "more"; render(); window.scrollTo(0, 0); };
  const bb = $("#bubble"); if(bb) bb.onclick = openCaptions;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { tab = b.dataset.go; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-tx]").forEach(b => b.onclick = () => openTx(findTx(b.dataset.tx)));
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => payBill(b.dataset.pay, b.dataset.ym));
  document.querySelectorAll("[data-bill]").forEach(b => b.onclick = () => openBill(S.bills.find(x => x.id === b.dataset.bill)));
  document.querySelectorAll("[data-newbill]").forEach(b => b.onclick = () => openBill(null));
  document.querySelectorAll("[data-em]").forEach(b => b.onclick = () => { entMonth = addM(entMonth || ymOf(iso(new Date())), +b.dataset.em); render(); });
  document.querySelectorAll("[data-cm]").forEach(b => b.onclick = () => { calMonth = addM(calMonth || ymOf(iso(new Date())), +b.dataset.cm); calSel = null; render(); });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { calSel = calSel === b.dataset.day ? null : b.dataset.day; render(); });
  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => openAcc(S.accounts.find(a => a.id === b.dataset.acc)));
  document.querySelectorAll("[data-newacc]").forEach(b => b.onclick = () => openAcc(null));
  document.querySelectorAll("[data-debt]").forEach(b => b.onclick = () => openDebt(S.debts.find(d => d.id === b.dataset.debt)));
  document.querySelectorAll("[data-newdebt]").forEach(b => b.onclick = () => openDebt(null));
  document.querySelectorAll("[data-goal]").forEach(b => b.onclick = openGoal);
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => openCat(S.cats.find(c => c.id === b.dataset.cat)));
  document.querySelectorAll("[data-newcat]").forEach(b => b.onclick = () => openCat(null));
  if(tab === "more") wireMore();
  if(tab === "grow") wireGrow();
  if(S && mode !== "loading") checkMilestones();
}
function wireMore(){
  $("#m-up").onclick = () => $("#m-file").click();
  $("#m-file").onchange = async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    try{ saveImg("cat", await shrinkPhoto(f, 320)); if(S.photo){ delete S.photo; saveSettings(); } toast("Photo saved"); render(); }
    catch(err){ toast("Couldn't read that photo. Try a JPG or PNG."); }
  };
  const rm = $("#m-rm"); if(rm) rm.onclick = () => { dropImg("cat"); if(S.photo){ delete S.photo; saveSettings(); } render(); };
  $("#cap-open").onclick = openCaptions;
  $("#bg-up").onclick = () => $("#bg-file").click();
  $("#bg-file").onchange = async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    try{ saveImg("bg", await shrinkPhoto(f, 1000, false, 0.72)); toast("Background set"); render(); }
    catch(err){ toast("Couldn't read that photo. Try a JPG or PNG."); }
  };
  const bgr = $("#bg-rm"); if(bgr) bgr.onclick = () => { dropImg("bg"); render(); };
  const dim = $("#bg-dim"); if(dim){ dim.oninput = () => document.documentElement.style.setProperty("--dim", dim.value / 100); dim.onchange = () => { S.bgDim = dim.value / 100; saveSettings(); }; }
  $("#snd").onchange = e => { S.sound = e.target.checked; saveSettings(); };
  document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));
  $("#s-save").onclick = () => {
    const p = Math.round(+$("#s-pay").value), c = r2($("#s-cap").value);
    if(!(p >= 1 && p <= 31)) return toast("Payday must be a day from 1 to 31.");
    if(!(c >= 0)) return toast("Wants cap must be zero or more.");
    S.payday = p; S.wantsCap = c; saveSettings(); toast("Saved"); render();
  };
  const ta = $("#b-text");
  $("#b-copy").onclick = async () => {
    const txt = JSON.stringify({S, TX});
    try{ await navigator.clipboard.writeText(txt); toast("Backup copied"); }
    catch(e){ ta.style.display = "block"; ta.value = txt; ta.select(); toast("Select all and copy the text below"); }
  };
  $("#b-restore").onclick = () => {
    if(ta.style.display !== "block" || !ta.value.trim()){ ta.style.display = "block"; ta.value = ""; ta.placeholder = "Paste your backup here, then tap Restore again"; ta.focus(); return; }
    try{
      const j = JSON.parse(ta.value); if(!j.S || !j.S.accounts) throw 0;
      const oldMonths = Object.keys(TX);
      S = j.S; TX = j.TX || {}; migrate(S);
      queueWrite("settings", S);
      new Set([...oldMonths, ...Object.keys(TX)]).forEach(saveMonth);
      toast("Backup restored"); render();
    }catch(e){ toast("That doesn't look like a Meowny backup."); }
  };
  $("#b-reset").onclick = () => confirmSheet("Erase everything?", "This deletes every entry, account, debt and bill. Copy a backup first if you might want it back.", "Erase", () => {
    const months = Object.keys(TX); TX = {}; months.forEach(saveMonth); Object.keys(IMG).forEach(dropImg);
    if(mode === "cloud"){ col.doc("settings").delete().catch(() => {}); } S = null; localSave(); render();
  });
}
function findTx(id){ return allTx().find(t => t.id === id); }

/* ---------- sheets ---------- */
function openSheet(html){ $("#sheetBody").innerHTML = html; wireIcon(); $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); setTimeout(() => { const f = $("#sheet [autofocus]"); if(f) f.focus(); }, 60); }
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
function confirmSheet(title, body, ok, fn){
  openSheet(`<div class="form"><h2 id="sheetTitle">${esc(title)}</h2><p class="muted" style="margin:0">${esc(body)}</p><div class="actions"><button class="btn ghost" id="c-no">Cancel</button><button class="btn" id="c-yes" style="background:var(--bad);color:#fff">${esc(ok)}</button></div></div>`);
  $("#c-no").onclick = closeSheet; $("#c-yes").onclick = () => { closeSheet(); fn(); };
}
function refOptions(sel, withCards){
  let h = S.accounts.map(a => `<option value="acc:${a.id}" ${sel === "acc:" + a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("");
  if(withCards){ const cards = S.debts.filter(d => d.kind === "card" || d.kind === "bnpl"); if(cards.length) h += `<optgroup label="On credit">` + cards.map(d => `<option value="debt:${d.id}" ${sel === "debt:" + d.id ? "selected" : ""}>${esc(d.name)}</option>`).join("") + `</optgroup>`; }
  return h;
}

function openTx(t, preset){
  const editing = !!t;
  const x = Object.assign({type:"out", amount:"", cat:"food", from:"acc:" + (S.accounts.find(a => a.id === "gxw") ? "gxw" : (S.accounts[0] || {}).id), to:"", date:iso(new Date()), note:""}, t || preset || {});
  if(x.type === "in" && !x.to) x.to = "acc:" + ((S.accounts.find(a => a.id === "gx") || S.accounts[0] || {}).id);
  let type = x.type, cat = x.cat, adding = false;
  const draw = () => {
    const groups = type === "in" ? [["income", "Income"]] : [["want", "Wants"], ["need", "Needs"], ["fixed", "Fixed"]];
    const newCat = adding
      ? `<div class="chiphead">New category</div><div class="row" style="width:100%;flex-wrap:wrap"><input id="nc-name" type="text" maxlength="30" placeholder="e.g. Pets" aria-label="New category name" style="flex:1;min-width:120px;border:1.5px solid var(--accent);background:var(--bg);border-radius:12px;padding:8px 10px">${type === "in" ? "" : `<select id="nc-group" aria-label="Category group" style="border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px"><option value="want">Want</option><option value="need">Need</option><option value="fixed">Fixed</option></select>`}<button type="button" class="btn small" id="nc-add">Add</button><button type="button" class="btn ghost small" id="nc-cancel">Cancel</button></div>`
      : `<button type="button" class="chip" id="nc-open" style="border-style:dashed;color:var(--accent)">+ New category</button>`;
    const chips = groups.map(([g, n]) => `<div class="chiphead">${n}</div>` + S.cats.filter(c => c.group === g).map(c => `<button type="button" class="chip ${cat === c.id ? "on" : ""}" data-c="${c.id}">${c.icon && c.icon.t === "e" ? c.icon.v + " " : ""}${esc(c.name)}</button>`).join("")).join("") + `<div class="chips" style="width:100%;margin-top:6px">${newCat}</div>`;
    const debtOpts = S.debts.map(d => `<option value="debt:${d.id}" ${x.to === "debt:" + d.id ? "selected" : ""}>${esc(d.name)} (${fmt(debtLeft(d))})</option>`).join("");
    $("#tx-fields").innerHTML =
      (type === "out" || type === "in" ? `<div class="chips">${chips}</div>` : "") +
      (type === "out" ? `<div class="field"><label for="t-from">Paid from</label><select id="t-from">${refOptions(x.from, true)}</select></div>` : "") +
      (type === "in" ? `<div class="field"><label for="t-to">Into</label><select id="t-to">${refOptions(x.to, false)}</select></div>` : "") +
      (type === "pay" ? `<div class="field"><label for="t-to">Debt</label><select id="t-to">${debtOpts}</select></div><div class="field"><label for="t-from">Paid from</label><select id="t-from">${refOptions(x.from, false)}</select></div>` : "") +
      (type === "save" ? `<div class="field"><label for="t-to">Into savings pot</label><select id="t-to">${(S.portfolios || []).map(p => `<option value="pf:${p.id}" ${x.to === "pf:" + p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label for="t-from">Taken from</label><select id="t-from"><option value="">New money, not from an account</option>${refOptions(x.from, false)}</select></div>` : "") +
      (type === "move" ? `<div class="field"><label for="t-from">From</label><select id="t-from">${refOptions(x.from, false)}</select></div><div class="field"><label for="t-to">To</label><select id="t-to">${refOptions(x.to || "acc:" + ((S.accounts[1] || S.accounts[0] || {}).id), false)}</select></div>` : "");
    document.querySelectorAll("#tx-fields [data-c]").forEach(b => b.onclick = () => { cat = b.dataset.c; keep(); draw(); });
    const op = $("#nc-open"); if(op) op.onclick = () => { keep(); adding = true; draw(); $("#nc-name").focus(); };
    const cc = $("#nc-cancel"); if(cc) cc.onclick = () => { keep(); adding = false; draw(); };
    const addCat = () => {
      const name = $("#nc-name").value.trim();
      if(!name){ $("#t-err").textContent = "Type a name for the new category."; return; }
      const group = type === "in" ? "income" : $("#nc-group").value;
      const dup = S.cats.find(c => c.group === group && c.name.toLowerCase() === name.toLowerCase());
      const c = dup || {id: uid8(), name, group, budget: null};
      if(!dup){ S.cats.push(c); saveSettings(); }
      cat = c.id; adding = false; $("#t-err").textContent = ""; keep(); draw();
    };
    const ad = $("#nc-add"); if(ad){ ad.onclick = addCat; $("#nc-name").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); addCat(); } }; }
    document.querySelectorAll("#tx-seg button").forEach(b => b.classList.toggle("on", b.dataset.t === type));
  };
  const keep = () => { const f = $("#t-from"), to = $("#t-to"); if(f) x.from = f.value; if(to) x.to = to.value; };
  openSheet(`<form class="form" id="tx-form" novalidate>
    <h2 id="sheetTitle">${editing ? "Edit entry" : "New entry"}</h2>
    <div class="seg" id="tx-seg"><button type="button" data-t="out">Spent</button><button type="button" data-t="in">Received</button><button type="button" data-t="pay">Paid debt</button><button type="button" data-t="move">Moved</button><button type="button" data-t="save">Saved</button></div>
    <div class="field"><label for="t-amt">Amount (RM)</label><input id="t-amt" class="amount-in" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${x.amount}" ${editing ? "" : "autofocus"}></div>
    <div id="tx-fields" class="form"></div>
    <div class="grid2"><div class="field"><label for="t-date">Date</label><input id="t-date" type="date" value="${x.date}"></div><div class="field"><label for="t-note">Note</label><input id="t-note" type="text" maxlength="80" placeholder="e.g. Sushi Zanmai" value="${esc(x.note)}"></div></div>
    <div class="err" id="t-err"></div>
    <div class="actions">${editing ? `<button type="button" class="btn danger" id="t-del">Delete</button>` : ""}<button class="btn" type="submit">${editing ? "Save" : "Add"}</button></div>
  </form>`);
  document.querySelectorAll("#tx-seg button").forEach(b => b.onclick = () => {
    keep(); type = b.dataset.t;
    if(type === "save"){ if(!x.to || !x.to.startsWith("pf:")) x.to = "pf:" + (((S.portfolios || [])[0]) || {}).id; if(x.from && !x.from.startsWith("acc:")) x.from = ""; }
    else if(x.to && x.to.startsWith("pf:")) x.to = "";
    if(type === "in" && catOf(cat).group !== "income") cat = "salary";
    if(type === "out" && catOf(cat).group === "income") cat = "food";
    if(type === "pay" && (!x.to || !x.to.startsWith("debt:"))) x.to = "debt:" + ((S.debts[0] || {}).id);
    if((type === "in" || type === "move") && x.to && x.to.startsWith("debt:")) x.to = "";
    if(type !== "out" && x.from && x.from.startsWith("debt:")) x.from = "acc:" + ((S.accounts[0] || {}).id);
    draw();
  });
  draw();
  if(editing) $("#t-del").onclick = () => { removeTx(t); closeSheet(); toast("Entry deleted"); render(); };
  $("#tx-form").onsubmit = e => {
    e.preventDefault(); keep();
    const amount = r2($("#t-amt").value), date = $("#t-date").value, err = $("#t-err");
    if(!(amount > 0)) return err.textContent = "Enter an amount above zero.";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err.textContent = "Pick a date.";
    if(type !== "in" && type !== "save" && !x.from) return err.textContent = "Choose where the money came from.";
    if(type === "save" && !(S.portfolios || []).length) return err.textContent = "Add a savings pot in Grow first.";
    if(type !== "out" && !x.to) return err.textContent = "Choose where the money went.";
    if(type === "move" && x.from === x.to) return err.textContent = "From and To must be different accounts.";
    if(type === "pay" && !S.debts.length) return err.textContent = "Add a debt in Money first.";
    const rec = {id: editing ? t.id : uid8(), ts: editing ? t.ts : String(Date.now()), type, amount, date, note: $("#t-note").value.trim(),
      cat: type === "out" || type === "in" ? cat : null, from: type === "in" ? "" : x.from, to: type === "out" ? "" : x.to,
      billId: x.billId || null, billMonth: x.billMonth || null};
    if(editing) removeTx(t, true);
    const ym = ymOf(date); (TX[ym] = TX[ym] || []).push(rec); saveMonth(ym);
    closeSheet(); toast(editing ? "Saved" : "Added"); render();
    if(!editing && isSavingTx(rec)) playFile("saved");
  };
}
function removeTx(t, quiet){
  const ym = ymOf(t.date); TX[ym] = (TX[ym] || []).filter(x => x.id !== t.id); saveMonth(ym);
}
function payBill(id, ym){
  const b = S.bills.find(x => x.id === id); if(!b) return;
  const d = billDate(b, ym), today = iso(new Date());
  const base = {amount: billAmount(b, ym), date: d && d < today ? d : today, note: b.name, billId: b.id, billMonth: ym};
  if(b.kind === "debt") openTx(null, Object.assign(base, {type:"pay", to:"debt:" + b.debtId, from: b.from && b.from.startsWith("acc:") ? b.from : "acc:" + ((S.accounts.find(a => a.id === "gx") || S.accounts[0] || {}).id)}));
  else openTx(null, Object.assign(base, {type:"out", cat: b.kind === "sub" ? "subs" : "bills", from: b.from || "acc:" + ((S.accounts.find(a => a.id === "gx") || S.accounts[0] || {}).id)}));
}

    {id:"epf", name:"EPF", icon:{t:"e", v:"🏦"}, opening:0, monthly:0, rate:5.5, inTotal:false, note:"Retirement money, so it's left out of All savings."}

    s.goals = [
      {id:"ef", name:"Emergency fund", icon:{t:"e", v:"🛟"}, target:8000, link:"all"},
      {id:"home", name:g.name, icon:{t:"e", v:"🏠"}, target:g.target, link:"all"}
    ]; delete s.goal; }
  if(!s.captions){ ch = true; s.captions = ["hello, i like money", "Put the bubble tea down, human.", "Grab Food again? Bold choice.", "Every ringgit saved buys me a treat.", "I'm watching your wants budget.", "Debt-free cats nap better."]; }
  if(s.sound === undefined){ ch = true; s.sound = true; }
  if(!s.ms){ ch = true; s.ms = {}; s.msQuiet = true; }
  return ch;
}

let actx = null;
function soundOn(){ return !S || S.sound !== false; }
function playFile(k){ if(!soundOn()) return; try{ const a = new Audio(SND[k]); const p = a.play(); if(p && p.catch) p.catch(() => {}); }catch(e){} }
function beep(f1, f2, dur, vol, at){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (at || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur * .6);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function tap(){ if(soundOn()) beep(900, 1350, 0.08, 0.08); }
function chime(){ if(!soundOn()) return; beep(660, 660, .16, .12, 0); beep(880, 880, .16, .12, .12); beep(1320, 1320, .3, .12, .24); }
document.addEventListener("click", e => { const b = e.target.closest("button"); if(b && b.id !== "splash-go") tap(); }, true);
function isSavingTx(t){
  if(t.type === "save") return true;
  if((t.type === "in" || t.type === "move") && t.to && t.to.startsWith("acc:")){ const a = S.accounts.find(x => "acc:" + x.id === t.to); return !!(a && a.type === "savings"); }
  return false;
}

/* ---------- captions ---------- */
function caption(fallback){ const c = (S && S.captions) || []; return c.length ? c[Math.floor(capPick * c.length) % c.length] : fallback; }
function openCaptions(){
  openSheet(`<form class="form" id="cap-form" novalidate><h2 id="sheetTitle">Captions</h2>
    <div class="small muted">One caption per line. A random one shows each time you open Meowny. Leave it empty and your cat gives budget tips instead.</div>
    <div class="field"><label for="cap-t">Captions</label><textarea id="cap-t" rows="8">${esc((S.captions || []).join("\n"))}</textarea></div>
    <div class="actions"><button type="button" class="btn ghost" id="cap-next">Show another</button><button class="btn" type="submit">Save</button></div></form>`);
  $("#cap-next").onclick = () => { capPick = (capPick + 0.37 + Math.random() * 0.3) % 1; render(); toast(caption("No captions yet")); };
  $("#cap-form").onsubmit = e => { e.preventDefault(); S.captions = $("#cap-t").value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 60); saveSettings(); closeSheet(); render(); };
}

/* ---------- savings ---------- */
function pfBal(p){ const r = "pf:" + p.id; return r2((+p.opening || 0) + allTx().filter(t => t.type === "save" && t.to === r).reduce((a, t) => a + t.amount, 0)); }
function savAccTotal(){ return r2(S.accounts.filter(a => a.type === "savings").reduce((a, x) => a + accBal(x), 0)); }
function totalSaved(){ return r2((S.portfolios || []).filter(p => p.inTotal !== false).reduce((a, p) => a + pfBal(p), 0) + savAccTotal()); }
function simulate(months){
  return (S.portfolios || []).map(p => {
    let b = pfBal(p); const r = (+p.rate || 0) / 100 / 12, m = +p.monthly || 0, mon = [b];
    for(let i = 1; i <= months; i++){ b = b * (1 + r) + m; mon.push(b); }
    return {p, mon};
  });
}
function goalSeries(g, sim){
  const sa = g.link === "all" ? savAccTotal() : 0;
  const parts = sim.filter(x => g.link === "all" ? x.p.inTotal !== false : x.p.id === g.link);
  return i => parts.reduce((a, x) => a + (x.mon[Math.min(i, x.mon.length - 1)] || 0), 0) + sa;
}
function goalNow(g){ return goalSeries(g, simulate(0))(0); }
function etaText(g, sim){
  const f = goalSeries(g, sim);
  if(f(0) >= g.target) return "Reached";
  for(let i = 1; i <= 600; i++) if(f(i) >= g.target){ const d = new Date(); d.setMonth(d.getMonth() + i); return "Around " + MONTHS[d.getMonth()] + " " + d.getFullYear() + " at this pace"; }
  return "Not within 50 years at this pace. Add a monthly amount.";
}
const PCOL = ["var(--accent)", "var(--need)", "var(--want)", "var(--good)", "var(--warn)", "var(--fixed)", "var(--bad)"];
function niceMax(v){ if(v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if(m * p >= v) return m * p; return 10 * p; }
const kfmt = v => v >= 1e6 ? "RM" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "m" : v >= 1000 ? "RM" + Math.round(v / 1000) + "k" : "RM" + Math.round(v);
function projHTML(){
  const P = S.portfolios || [], yrs = growYears, n = yrs * 12, sim = simulate(Math.max(n, 600));
  const total = i => sim.reduce((a, x) => a + x.mon[i], 0);
  const end = total(n), put = sim.reduce((a, x) => a + pfBal(x.p) + (+x.p.monthly || 0) * n, 0);
  const year0 = new Date().getFullYear();
  if(!P.length) return `<div class="empty">Add a savings pot to see the projection.</div>`;
  const W = 340, H = 200, L = 46, B = 24, T = 10, Rr = 8, iw = W - L - Rr, ih = H - T - B;
  const ymax = niceMax(end * 1.02), X = i => L + i / n * iw, Y = v => T + ih - v / ymax * ih;
  const step = Math.max(1, Math.ceil(n / 60));
  const idx = []; for(let i = 0; i <= n; i += step) idx.push(i); if(idx[idx.length - 1] !== n) idx.push(n);
  let base = idx.map(() => 0), areas = "";
  sim.forEach((x, k) => {
    const top = idx.map((i, j) => base[j] + x.mon[i]);
    const up = idx.map((i, j) => `${X(i).toFixed(1)},${Y(top[j]).toFixed(1)}`).join(" ");
    const down = idx.slice().reverse().map((i, jj) => { const j = idx.length - 1 - jj; return `${X(i).toFixed(1)},${Y(base[j]).toFixed(1)}`; }).join(" ");
    areas += `<polygon points="${up} ${down}" fill="${PCOL[k % PCOL.length]}" fill-opacity=".8"/>`;
    base = top;
  });
  let grid = "";
  [0, .5, 1].forEach(f => { const v = ymax * f, y = Y(v); grid += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${kfmt(v)}</text>`; });
  const xt = [0, Math.round(yrs / 2), yrs].filter((v, i, a) => a.indexOf(v) === i).map(v => `<text x="${X(v * 12)}" y="${H - 6}" text-anchor="${v === 0 ? "start" : v === yrs ? "end" : "middle"}">${year0 + v}</text>`).join("");
  const goals = (S.goals || []).filter(g => g.target <= ymax).sort((a, b) => a.target - b.target);
  let gl = "", lastY = 1e9;
  goals.forEach(g => { const y = Y(g.target); gl += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4"/>`; if(lastY - y > 14){ gl += `<text x="${W - Rr - 2}" y="${y - 4}" text-anchor="end" style="fill:var(--ink);font-weight:700">${esc((g.icon && g.icon.t === "e" ? g.icon.v + " " : "") + g.name.slice(0, 22))}</text>`; lastY = y; } });
  return `<div class="label">In ${yrs} year${yrs > 1 ? "s" : ""} (${year0 + yrs})</div>
    <div class="big">${fmt0(end)}</div>
    <div class="small muted">You put in ${fmt0(put)} · growth ${fmt0(Math.max(0, end - put))}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected savings over ${yrs} years, reaching ${fmt0(end)}">${grid}${areas}${gl}${xt}</svg>
    <div class="legend2">${P.map((p, k) => `<span><i style="background:${PCOL[k % PCOL.length]}"></i>${esc(p.name)}</span>`).join("")}</div>`;
}
function growHTML(){
  const P = S.portfolios || [], G = S.goals || [], sim = simulate(600), ms = milestones();
  return `<div class="card"><div class="row between"><h2>Savings projection</h2></div>
      <div id="proj" style="margin-top:8px">${projHTML()}</div>

      <div class="ms" style="margin-bottom:10px">${ms.map(m => `<div class="badge ${m.done ? "done" : ""}"><div class="em" aria-hidden="true">${m.em}</div><div><b>${esc(m.title)}</b><span>${m.done ? "Unlocked" + (S.ms[m.id] && S.ms[m.id] !== true ? " " + niceD(S.ms[m.id]) : "") : esc(m.desc) + (m.prog != null ? ` · ${Math.round(Math.min(1, m.prog) * 100)}%` : "")}</span></div></div>`).join("")}</div>
      <button class="btn ghost small" id="ms-reset">Reset milestones</button>
    </div>`;
}

  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => openPf((S.portfolios || []).find(p => p.id === b.dataset.pf)));

  });
}

    ev.preventDefault();

    rec.opening = r2(bal - (e ? before - (+p.opening || 0) : 0));

function openGoal(g){

/* ---------- milestones ---------- */
function milestones(){
  const today = iso(new Date()), saved = totalSaved(), all = allTx().filter(t => !S.msFromTs || +t.ts > S.msFromTs);
  const days = new Set(all.map(t => t.date));
  let streak = 0; { const d = new Date(); if(!days.has(iso(d))) d.setDate(d.getDate() - 1); while(days.has(iso(d))){ streak++; d.setDate(d.getDate() - 1); } }
  const first = all.length ? all.map(t => t.date).sort()[0] : null;
  const wantDays = new Set(all.filter(t => t.type === "out" && catOf(t.cat).group === "want").map(t => t.date));
  let noSpend = 0, tracked = 0;
  if(first){ const d = parseD(first), y = new Date(); y.setHours(0,0,0,0); y.setDate(y.getDate() - 1); while(d <= y){ tracked++; if(!wantDays.has(iso(d))) noSpend++; d.setDate(d.getDate() + 1); } }
  const wk = new Date(); wk.setDate(wk.getDate() - 6); const wkS = iso(wk);
  const last7 = all.filter(t => t.type === "out" && t.date >= wkS && catOf(t.cat).group === "want").reduce((a, t) => a + t.amount, 0);
  const cur = cycle(), prev = cycle(new Date(cur.start.getTime() - 864e5));
  const prevList = all.filter(t => t.date >= prev.s && t.date < prev.e);
  const prevOk = first && first <= prev.s && prevList.filter(t => t.type === "out" && catOf(t.cat).group === "want").reduce((a, t) => a + t.amount, 0) <= S.wantsCap;
  const ym = ymOf(today), pym = addM(ym, -1);
  const billsOk = [ym, pym].some(m => { const act = S.bills.filter(b => billActive(b, m)); return act.length > 0 && act.every(b => billPaid(b, m)); });
  const debtPaid = S.debts.reduce((a, d) => a + Math.max(0, -debtEffect(d.id, all)), 0);
  const D = id => S.debts.find(d => d.id === id);
  const L = [
    ["first","✏️","First entry","Log anything at all", all.length >= 1],
    ["streak3","🔥","3-day streak","Log something 3 days running", streak >= 3, streak / 3],
    ["nospend1","🧘","No-spend day","A whole day with no wants", noSpend >= 1],
    ["save100","🐷","First RM100 saved","Put RM100 into savings", saved >= 100, saved / 100],
    ["setup","🏦","All set up","Every account has a balance", S.accounts.length > 0 && S.accounts.every(a => a.opening != null)],
    ["cat","🐱","Meet the boss","Add your cat's photo", !!catPhoto()],
    ["streak7","🔥","7-day streak","A full week of logging", streak >= 7, streak / 7],
    ["thrifty","🍱","Thrifty week","Under RM100 on wants in 7 days", tracked >= 7 && last7 <= 100],
    ["nospend5","🧘","5 no-spend days","Treats can wait", noSpend >= 5, noSpend / 5],
    ["bills","🧾","Bills all paid","Every bill marked paid in a month", billsOk],
    ["debt500","⛓️","RM500 of debt paid","Logged debt payments", debtPaid >= 500, debtPaid / 500],
    ["save1k","💰","RM1,000 saved","Four figures", saved >= 1000, saved / 1000],
    ["cap","🎯","Under the cap","Finish a pay month under your wants cap", !!prevOk],
    ["debt2k","⛓️","RM2,000 of debt paid","Keep going", debtPaid >= 2000, debtPaid / 2000]
  ];
  if(D("spl")) L.push(["spl","🛍️","SPayLater gone","Last bill paid", debtLeft(D("spl")) <= 0]);
  if(D("cimb")) L.push(["cimb","💳","CIMB card cleared","Balance at zero", debtLeft(D("cimb")) <= 0]);
  if(D("gf")) L.push(["gf","💌","Loan repaid","Loan settled", debtLeft(D("gf")) <= 0]);
  L.push(["ef","🛟","Emergency fund","RM8,000 saved", saved >= 8000, saved / 8000]);
  L.push(["save10k","💎","RM10,000 saved","Five figures", saved >= 10000, saved / 10000]);
  return L.map(([id, em, title, desc, done, prog]) => ({id, em, title, desc, done: !!(done || (S.ms && S.ms[id])), prog: done ? null : prog}));
}
function checkMilestones(){
  if(!S.ms) S.ms = {};
  const fresh = milestones().filter(m => m.done && !S.ms[m.id]);
  if(!fresh.length){ if(S.msQuiet){ delete S.msQuiet; saveSettings(); } return; }
  fresh.forEach(m => S.ms[m.id] = iso(new Date()));
  const quiet = S.msQuiet; delete S.msQuiet; saveSettings();
  if(quiet) return;
  setTimeout(() => { toast(fresh.length === 1 ? `Milestone unlocked: ${fresh[0].em} ${fresh[0].title}` : `${fresh.length} milestones unlocked`); chime(); }, 300);
}
const PALETTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>';

$("#fab").onclick = () => openTx(null);
document.querySelectorAll("#navbar button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

/* ---------- boot ---------- */
function applyDocs(docs){
  for(const d of docs){
    const id = d.id; if(pending[id] || writing[id]) continue;
    const body = d.data();
    if(id === "settings"){ if(body){ S = JSON.parse(JSON.stringify(body)); if(migrate(S)) saveSettings(); } }
    else if(id.startsWith("img-")){ if(body && body.d) IMG[id.slice(4)] = body.d; }
    else if(id.startsWith("tx-")) TX[id.slice(3)] = body && Array.isArray(body.items) ? JSON.parse(JSON.stringify(body.items)) : [];
  }
}
async function boot(){
  render();
  const hot = window.claude && window.claude.hot;
  if(hot && hot.snapshot) hot.snapshot(() => ({tab}));
  if(hot && hot.data && hot.data.tab) tab = hot.data.tab;
  let db = null, uid = null;
  try{
    if(window.claude && typeof window.claude.use === "function"){
      db = await window.claude.use("db");
      const u = await window.claude.use("user");
      uid = u ? await u.id() : null;
    }
  }catch(e){ db = null; }
  if(!db || !uid){ mode = "local"; localLoad(); if(S) localSave(); render(); return; }
  col = db.collection("data/users/" + uid);
  const timer = setTimeout(() => { slow = true; render(); }, 10000);
  col.onSnapshot(snap => {
    applyDocs(snap.docs);
    const hasSettings = snap.docs.some(d => d.id === "settings");
    if(!snap.metadata.fromCache){ clearTimeout(timer); slow = false; cloudReady = true; }
    if(mode === "loading" && (hasSettings || !snap.metadata.fromCache)) mode = "cloud";
    if(mode === "cloud" && !hasSettings && cloudReady && !pending.settings && !writing.settings) S = null;
    if(!document.querySelector("#sheet.open")) render();
  }, err => {
    clearTimeout(timer);
    if(mode === "loading"){ mode = "local"; localLoad(); }
    render();
  });
}
boot();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
